name: opscenter-continuity

services:
  database:
    image: postgres:18.4-alpine
    restart: unless-stopped
    env_file:
      - path: /etc/opscenter/continuity-database.env
        format: raw
    volumes:
      - /srv/opscenter/continuity-database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U opscenter_admin -d opscenter_production']
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  app:
    image: opscenter:continuity-readers-20260914
    restart: unless-stopped
    init: true
    # Match the mirror owner: source snapshots intentionally retain private modes.
    user: '1000:1000'
    group_add: ['1001']
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - path: /etc/opscenter/continuity-app.env
        format: raw
    environment:
      NODE_ENV: production
      OPSCENTER_RUNTIME: VPS
      OPSBOT_DATA_DIR: /app/data
      OPSCENTER_DATA_DIR: /app/data
      OPSCENTER_KERNEL_ENABLED: '1'
      OPSCENTER_LINXUP_MAX_AGE_SECONDS: '900'
      OPSCENTER_JUNKWARE_SCHEDULE_MAX_AGE_SECONDS: '900'
      OPSCENTER_FINANCIAL_STATEMENTS_DIR: /var/lib/opscenter/financial-statements
      QBO_TOKEN_STORE_DIR: /var/lib/opscenter/qbo
      NODE_USE_ENV_PROXY: '1'
      HTTPS_PROXY: http://auth-egress:3128
      HTTP_PROXY: http://auth-egress:3128
      NO_PROXY: localhost,127.0.0.1,database
      OPSCENTER_LOGIN_RATE_LIMIT_FILE: /var/lib/opscenter/continuity-auth/login-attempts.json
    volumes:
      - /srv/opscenter/data:/app/data:ro
      - /srv/opscenter/qbo:/var/lib/opscenter/qbo:ro
      - /srv/opscenter/continuity-20260912/financial-statements:/var/lib/opscenter/financial-statements:ro
      - /srv/opscenter/continuity-20260912/auth:/var/lib/opscenter/continuity-auth
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: [/bin/sh, -lc, 'umask 0007 && exec npm run start -- -H 0.0.0.0 -p 3000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(r=>{if(r.status>=400)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  app-ingress:
    image: node:22-bookworm-slim
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [default, auth-outbound]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - /srv/opscenter/continuity-20260912/continuity-auth-egress.mjs:/opt/continuity-auth-egress.mjs:ro
    command: [node, /opt/continuity-auth-egress.mjs, --ingress]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  auth-egress:
    image: node:22-bookworm-slim
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [default, auth-outbound]
    env_file:
      - path: /etc/opscenter/continuity-auth-egress.env
        format: raw
    volumes:
      - /srv/opscenter/continuity-20260912/continuity-auth-egress.mjs:/opt/continuity-auth-egress.mjs:ro
    command: [node, /opt/continuity-auth-egress.mjs]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  gateway:
    image: node:22-bookworm-slim
    profiles: [gateway]
    restart: unless-stopped
    init: true
    network_mode: host
    user: '1000:1000'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - /srv/opscenter/continuity-20260912/continuity-proxy.mjs:/opt/continuity-proxy.mjs:ro
      - /srv/opscenter/continuity-20260912/status:/state:ro
    environment:
      CONTINUITY_SNAPSHOT_FILE: /state/database-sync.json
    command: [node, /opt/continuity-proxy.mjs]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

# The candidate reaches its isolated database and the exact Access issuer via
# a restricted TLS proxy. All other external requests are denied.
networks:
  default:
    internal: true
  auth-outbound: {}
