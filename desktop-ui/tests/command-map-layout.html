<!doctype html><html><head><meta charset="utf-8"><title>Command map layout check</title><style>body{font:14px system-ui;margin:12px}button{padding:8px}iframe{display:block;border:1px solid #aaa;margin-top:12px}pre{white-space:pre-wrap}</style></head><body><h1>Command map layout check</h1><p>Synthetic appointments and trucks. Desktop split, narrower stacked layout, and individual marker coverage.</p><button id="run">Check layouts</button><pre id="result">Ready</pre><iframe id="preview"></iframe><script>
const frame=document.querySelector('#preview'),result=document.querySelector('#result');
const sizes=[[1920,1080],[1525,768],[1405,768],[1280,768],[1024,768],[390,844],[320,568]];
document.querySelector('#run').onclick=async()=>{result.textContent='';for(const [width,height] of sizes){frame.width=width;frame.height=height;frame.src='./aspect-ratio.html?workspace=Command&commandMap=1';await new Promise(resolve=>frame.onload=resolve);const doc=frame.contentDocument;for(let tries=0;tries<80&&!doc.querySelector('.command-map .leaflet-marker-icon');tries++)await new Promise(resolve=>setTimeout(resolve,100));await new Promise(resolve=>setTimeout(resolve,200));const errors=[],feed=doc.querySelector('.command-feed'),map=doc.querySelector('.command-map-column');if(!feed||!map){errors.push('Missing feed/map');}else{const f=feed.getBoundingClientRect(),m=map.getBoundingClientRect();if(width>=1280&&(m.left<f.right-1||Math.abs(m.top-f.top)>1))errors.push('Map not beside feed');if(width<1280&&m.top<f.bottom-1)errors.push('Stack overlaps');if(width>=1280&&doc.querySelector('.command-map .schedule-map-canvas')?.getBoundingClientRect().top>height-120)errors.push('Map below first screen');}if(doc.documentElement.scrollWidth>width+1)errors.push('Page overflow '+doc.documentElement.scrollWidth);if(width>=1280){if(doc.querySelectorAll('.command-map .appointment-marker').length!==18)errors.push('Appointment markers missing');if(doc.querySelectorAll('.command-map .truck-marker').length!==6)errors.push('Truck markers missing');}result.textContent+=`${width} × ${height}: ${errors.length?errors.join('; '):'PASS'}\n`;}result.textContent+='Complete';};
</script></body></html>
