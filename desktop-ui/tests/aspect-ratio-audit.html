<!doctype html><html><head><meta charset="utf-8"><title>Workspace aspect ratio audit</title><style>body{font:14px system-ui;margin:12px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:5px;text-align:left}iframe{display:block;border:1px solid #999;margin-top:12px}button{padding:8px;margin:4px}</style></head><body><h1>Workspace aspect ratio audit</h1><p>Synthetic data only. Checks all six workspaces for page overflow, clipped navigation, labels, lane content and overlapping schedule footer.</p><button id="run">Run audit</button><pre id="status">Ready</pre><table><thead><tr><th>Workspace</th><th>Viewport</th><th>Result</th></tr></thead><tbody id="results"></tbody></table><iframe id="preview"></iframe><script>
const sizes=[[1920,1080],[1525,768],[1405,768],[1366,600],[1024,768],[768,1024],[844,390],[390,844],[320,568]];
const workspaces=['Command','Schedule','Krewe','Fleet','Marketing','Finance'];
const frame=document.querySelector('#preview');
async function load(workspace,width,height){frame.width=width;frame.height=height;frame.src='./aspect-ratio.html?workspace='+workspace;await new Promise(resolve=>frame.onload=resolve);await new Promise(resolve=>setTimeout(resolve,1300));for(let attempt=0;attempt<30;attempt++){if(!/Loading\s+(Krewe|Fleet|Marketing|Finance)/i.test(frame.contentDocument.body.innerText))break;await new Promise(resolve=>setTimeout(resolve,100));}return frame.contentDocument;}
function inspect(doc,workspace,width,height){const errors=[];if(/Loading\s+(Krewe|Fleet|Marketing|Finance)/i.test(doc.body.innerText))errors.push('Still loading');if(doc.documentElement.scrollWidth>width+1)errors.push('Page overflow '+doc.documentElement.scrollWidth);
 const sidebar=doc.querySelector('.ops-sidebar');if(sidebar && getComputedStyle(sidebar).display!=='none' && sidebar.scrollHeight>sidebar.clientHeight+1&&!/auto|scroll/.test(getComputedStyle(sidebar).overflowY))errors.push('Sidebar clipped');
 if(!doc.querySelector('.workspace'))errors.push('Workspace not loaded');
 for(const cell of doc.querySelectorAll('.schedule-truck-cell')){const box=cell.getBoundingClientRect();for(const label of cell.querySelectorAll('strong,.schedule-truck-load')){const rect=label.getBoundingClientRect();if(rect.left<box.left-1||rect.right>box.right+1||rect.top<box.top-1||rect.bottom>box.bottom+1)errors.push('Truck label clipped');}}
 const rows=[...doc.querySelectorAll('[data-schedule-truck]')];const footer=doc.querySelector('.schedule-appointments-jump');if(rows.length && footer && rows.at(-1).getBoundingClientRect().bottom>footer.getBoundingClientRect().top+1)errors.push('Footer covers rows');
 for(const block of doc.querySelectorAll('.schedule-appointment,.schedule-truck-progress')){const parent=block.closest('.live-truck-timeline');if(parent){const box=parent.getBoundingClientRect(),rect=block.getBoundingClientRect();if(rect.bottom>box.bottom+1||rect.right>box.right+1)errors.push('Lane content outside row');}}
 for(const content of doc.querySelectorAll('.schedule-timeline-content')){const box=content.parentElement.getBoundingClientRect(),rect=content.getBoundingClientRect();if(Math.abs(rect.width-box.width)>1||Math.abs(rect.height-box.height)>1)errors.push('Scaled lane differs from hour grid');}
 const over=[...doc.querySelectorAll('.workspace *')].filter(el=>el.getBoundingClientRect().width>0&&el.getBoundingClientRect().right>width+1&&!el.closest('.leaflet-pane'));if(errors.some(e=>e.startsWith('Page overflow')))errors.push(over.slice(0,4).map(el=>el.className).join(','));
 return [...new Set(errors)];}
document.querySelector('#run').onclick=async()=>{document.querySelector('#results').textContent='';for(const workspace of workspaces)for(const [width,height] of sizes){document.querySelector('#status').textContent=`Checking ${workspace} ${width}×${height}`;const doc=await load(workspace,width,height);const errors=inspect(doc,workspace,width,height);const tr=document.createElement('tr');for(const text of [workspace,`${width}×${height}`,errors.length?errors.join('; '):'PASS']){const td=document.createElement('td');td.textContent=text;tr.append(td)}document.querySelector('#results').append(tr);}document.querySelector('#status').textContent='Complete';};
</script></body></html>
