display_information:
  name: OpsCenter Alerts
  description: Posts deduplicated operational alerts and recovery notices from OpsCenter.
  background_color: "#111827"
features:
  bot_user:
    display_name: OpsCenter
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
    request_url: https://hooks.junk-king.app/api/integrations/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
