<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <title>OpsCenter | Connection Required</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #07090d; color: #f5f7fa; }
      main { width: min(100%, 420px); border: 1px solid #343b45; border-top: 5px solid #ed1c24; border-radius: 10px; padding: 24px; background: #111318; box-shadow: 0 18px 48px rgba(0, 0, 0, .35); }
      .eyebrow { margin: 0 0 8px; color: #8f9baa; font-size: .75rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
      h1 { margin: 0 0 10px; font-size: 1.55rem; line-height: 1.15; }
      p { margin: 0 0 18px; color: #c5ccd5; line-height: 1.55; }
      .truth { padding: 12px; border-left: 4px solid #f0c44d; background: #191d23; color: #f5e7b8; font-size: .92rem; }
      button { min-height: 44px; width: 100%; margin-top: 18px; border: 1px solid #e42a31; border-radius: 6px; background: #ed1c24; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #7eabd1; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Junk King Louisiana</p>
      <h1>OpsCenter needs a live connection</h1>
      <p>Reconnect to the internet, then try again.</p>
      <p class="truth">No schedule, GPS, payroll, or financial data is stored for offline use. This prevents stale information from looking current.</p>
      <button type="button" onclick="location.reload()">Retry Connection</button>
    </main>
  </body>
</html>
