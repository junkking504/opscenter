<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Save synthetic review capture</title></head><body><h1>Save synthetic review capture</h1><p>Test-only PNG download for captured synthetic workspace views.</p><label>Filename <input id="name" value="command-after.png"></label><label>PNG data <textarea id="data"></textarea></label><button id="save">Save PNG</button><script>document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download=document.querySelector('#name').value.replace(/[^a-z0-9.-]/gi,'-');const raw=atob(document.querySelector('#data').value);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));a.href=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};</script></body></html>
